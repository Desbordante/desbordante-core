[build-system]
requires = ["scikit-build-core", "pybind11", "cmake>=3.25"]
build-backend = "scikit_build_core.build"

[project]
name = "desbordante"
version = "2.5.0"
description = "Science-intensive high-performance data profiler"
requires-python = ">=3.10"
readme = "README_PYPI.md"
license = { text = "AGPL-3.0-only" }

classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

urls = { homepage = "https://github.com/desbordante/desbordante-core", repository = "https://github.com/desbordante/desbordante-core", issues = "https://github.com/desbordante/desbordante-core/issues" }

[tool.scikit-build.cmake.define]
DESBORDANTE_BINDINGS = "INSTALL"
DESBORDANTE_BUILD_NATIVE = "OFF"
DESBORDANTE_BUILD_TESTS = "OFF"
DESBORDANTE_UNPACK_DATASETS = "OFF"
ASAN = "OFF"
CMAKE_BUILD_TYPE = "Release"
CPM_SOURCE_CACHE = { env = "CPM_SOURCE_CACHE", default = "./cmake/cpm-cache" }

[tool.scikit-build.sdist]
include = ["lib/*"]
exclude = [
    "datasets/*",
    "images/*",
    "pull_datasets.sh",
    "docs/*",
    "test_input_data/",
    "src/tests/*",
    "examples/*",
]

[tool.typos]
[tool.typos.files]
extend-exclude = [
    # We only want to check code for now, skip datasets.
    "test_input_data/",
    "examples/datasets/",
]
[tool.typos.default]
extend-ignore-re = [
    # C++ standard library
    "countr_zero",
    # These strings contain words that are often legitimate typos on their own,
    # but they are not typos in the context here, they're just used as dummy strings.
    '"(ba|helo|abd)"', # typos for "by/be", "hello", "and/bad"
    "// Частоты: abc:2, abd:1", # "abd" is a typo for "and/bad"
    
    # For GDD, `rela` is an abbreviation for `relation`
    "x'?\\.rela", 

    # "nd" is a common typo for "and", but Numerical Dependency, abbreviated as "ND",
    # is a legitimate pattern type. These are the strings referring to it.
    "# --- ND ---",
    "// AC, ND",
    "// ND",
    "an ND",
    "clusters violating ND",
    "ND holds",
    "ND verification",
    "Weight of ND",
    "7ND-93L",
    # Academic references and Proper names
    "BA thesis\\.pdf", # "BA" is Bachelor of Arts (typo for "BY" or "BE")
    "Comput\\. J\\.", # "Comput" is short for Computer (typo for "Compute")
    "Peter J\\. Hass", # "Hass" is a surname (typo for "Hash")
    "Sebastiaan Weytjens", # Author's name; "Sebastiaan" is flagged as "Sebastian"
]

[tool.typos.default.extend-words]
# TKE is the name of the algorithm, considered to be a typo for "take"
tke = "tke"

[tool.typos.default.extend-identifiers]
# These are identifiers related to Numerical Dependencies, abbreviated as ND,
# and "nd" is a common typo for "and", so we chose to explicitly list the identifiers
# instead of blanket excluding "nd" from checking.
bind_nd = "bind_nd"
BindNd = "BindNd"
bind_nd_verification = "bind_nd_verification"
BindNdVerification = "BindNdVerification"
kTestND = "kTestND"
MakeNdNameTuple = "MakeNdNameTuple"
nd = "nd"
ND = "ND"
nd1 = "nd1"
nd2 = "nd2"
nd_holds = "nd_holds"
NDHolds = "NDHolds"
nd_module = "nd_module"
nd_verification = "nd_verification"
nd_verification_datasets = "nd_verification_datasets"
nd_verification_module = "nd_verification_module"
nd_verifier = "nd_verifier"
NDVerifier = "NDVerifier"
NDVerifierHeavyDatasets = "NDVerifierHeavyDatasets"
NDVerifierTestNullEqualNull = "NDVerifierTestNullEqualNull"
NDVerifierTestSuite = "NDVerifierTestSuite"
NDVerifyingParams = "NDVerifyingParams"
TestND = "TestND"
test_nd_verifier = "test_nd_verifier"
TestNDVerifying = "TestNDVerifying"
VerifyND = "VerifyND"
verifying_nd = "verifying_nd"
verifying_nd_1 = "verifying_nd_1"
verifying_nd_1_output = "verifying_nd_1_output"
verifying_nd_2 = "verifying_nd_2"
verifying_nd_2_output = "verifying_nd_2_output"
verifying_nd_3 = "verifying_nd_3"
verifying_nd_3_output = "verifying_nd_3_output"

[tool.typos.type.jupyter]
extend-ignore-re = [
    # Auto-generated notebook metadata
    '\"id":\s*"[^"\n]*"', # Ignore auto-generated random alphanumeric IDs

    # Code snippets and specific variables in notebooks
    "ser\\.iloc\\[pos\\]", # "ser" is short for pandas Series
    "flights_dd_dif_tabl", # "dif" / "tabl" are short for difference / table
]

# For GDD, "rela" is an abbreviation for the "relation"
[tool.typos.type.gdd]
extend-glob = [
    "*gdd*.cpp",
    "*gdd*.h",
    "*gdd*.py",
]
[tool.typos.type.gdd.extend-identifiers]
rela = "rela"
[tool.typos.type.gdd.extend-words]
rela = "rela"

[tool.ruff]
# line-length: 120 instead of default 88
# Reason: Examples often have long f-strings with column names, URLs, table data
# that are more readable on one line than split across multiple lines
# Also allows for better formatted output in demonstration scripts
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001", # Missing argument annotation: argument types are optional
    "ANN003", # Missing **kwargs annotation: argument types are optional
    "ANN201", # Missing public-function return annotation: return types are optional
    "ANN202", # Missing private-function return annotation: return types are optional
    "COM812", # Missing trailing comma: let the Ruff formatter manage trailing commas in notebooks
    "COM819", # Prohibited trailing comma: allow commas that preserve multiline formatter layout
    "D203",   # Blank line before class docstring: prefer no blank line (D211)
    "D213",   # Multiline summary on the second line: prefer the first line (D212)
    "FBT001", # Boolean-typed positional argument: helpers may accept Boolean flags positionally
    "FIX002", # TODO comment: allow TODOs as reminders of unfinished work
    "NPY002", # Legacy NumPy random API: preserve seeded example datasets and their demonstrated results
    "PLR0915", # Too many statements: keep sequential explanations and print calls together in example functions
    "PTH110", # os.path.exists(): os.path and pathlib are both acceptable for filesystem paths
    "PTH118", # os.path.join(): os.path and pathlib are both acceptable for filesystem paths
    "PTH123", # Builtin open(): both open(path) and Path.open() are acceptable
    "TD002",  # Missing TODO author: TODO comments do not require individual ownership
    "TD003",  # Missing TODO issue link: TODO comments do not require a tracking issue
]

exclude = [
    ".git",
    "build/",
]

[tool.ruff.lint.per-file-ignores]
# Example scripts explain their usage through output; docstrings are not required on every definition
"examples/**/*.py" = [
    "D100", # Missing public-module docstring
    "D101", # Missing public-class docstring
    "D102", # Missing public-method docstring
    "D103", # Missing public-function docstring
    "D104", # Missing public-package docstring
    "D107", # Missing __init__ docstring
    "INP001", # Missing __init__.py: examples are standalone scripts, not importable packages
    "RUF001", # Ambiguous Unicode in strings: explanatory output uses mathematical symbols and punctuation
    "T201", # print(): console output is the purpose of these examples
]
"examples/**/*.ipynb" = [
    "D103", # Missing function docstring: Markdown cells explain notebook helpers
    "RUF001", # Ambiguous Unicode in strings: explanatory output uses mathematical symbols and punctuation
    "T201", # print(): notebook output demonstrates algorithm results
]
# Pytest uses assert statements for regression checks
"examples/test_examples/test_examples_pytest.py" = ["S101"]
# These files intentionally use unittest-style assertions and internal binding options
"src/python_bindings/test_bindings.py" = [
    "D100", # Missing module docstring: test names and cases document the checks
    "D101", # Missing class docstring: test classes group related checks
    "D102", # Missing method docstring: test method names describe the checks
    "D103", # Missing function docstring: helpers support the test cases in this module
    "INP001", # Missing __init__.py: tests are discovered without making this directory a Python package
    "PT009", # unittest assertion: preserve the TestCase assertion style
    "PT027", # unittest assertRaises: preserve the TestCase exception-checking style
    "SLF001", # Private-member access: these tests exercise internal binding option setters
]
"src/python_bindings/test_pybind_data_stats.py" = [
    "D100", # Missing module docstring: test names and cases document the checks
    "D101", # Missing class docstring: test classes group related checks
    "D102", # Missing method docstring: test method names describe the checks
    "D103", # Missing function docstring: helpers support the test cases in this module
    "INP001", # Missing __init__.py: tests are discovered without making this directory a Python package
    "PT009", # unittest assertion: preserve the TestCase assertion style
]
# Generated snapshots preserve exact captured output and snapshottest formatting
"examples/test_examples/snapshots/*.py" = [
    "E501", # Long lines: preserve captured output without wrapping
    "W291", # Trailing whitespace: preserve captured output exactly
    "Q000", # Inline-string quotes: snapshottest chooses the generated quote style
    "Q001", # Multiline-string quotes: snapshottest chooses the generated quote style
    "UP009", # UTF-8 encoding declaration: written by snapshottest
    "UP010", # Unnecessary __future__ import for Python 3.10+: written by snapshottest
    "I001", # Import sorting: preserve the generator's import layout
]
