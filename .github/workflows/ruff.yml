name: Ruff

# Kept separate from check-codestyle.yml: its workflow-level paths-ignore skips
# examples and pyproject.toml to avoid running C++ checks for unrelated changes.
on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.ipynb'
      - pyproject.toml
      - .github/workflows/ruff.yml
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.ipynb'
      - pyproject.toml
      - .github/workflows/ruff.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Ruff
        uses: astral-sh/ruff-action@v4
        with:
          version: "0.15.14"
          args: "check --output-format=github"
      - name: Check notebook formatting
        uses: astral-sh/ruff-action@v4
        with:
          version: "0.15.14"
          args: "format --check"
          src: "examples/notebooks"
